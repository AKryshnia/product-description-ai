[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "product-description-ai"
version = "0.1.0"
description = "MVP: генерация черновиков товарных карточек КИП для B2B-каталога через GigaChat"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic-settings>=2.4,<3",
    "gigachat>=0.2.4,<0.3",
    "httpx>=0.27,<1",  # импортируется адаптером напрямую (исключения транспорта)
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# предупреждение стороннего TestClient (httpx vs httpx2) — не относится к коду проекта
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# RUF001-003 не включены: проект русскоязычный, кириллица в строках — норма.
select = ["E", "F", "I", "UP", "B", "SIM"]
